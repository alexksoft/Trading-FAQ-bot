  # ------------------------------------------------------------------
  # 33. ADDITIONAL COMMON QUESTIONS
  # ------------------------------------------------------------------
  - id: best-indicator
    category: general
    triggers: ["best indicator", "which indicator is best", "most accurate indicator"]
    match_type: contains
    priority: 60
    response: >-
      There's no single "best" indicator - each measures one thing (momentum,
      trend, volatility, volume). Piling on many that say the same thing adds false
      confidence. Most traders use a small, complementary set plus price and volume,
      and rely on confirmation over any one signal.

  - id: leading-vs-lagging
    category: general
    triggers: ["leading vs lagging", "leading indicator", "lagging indicator"]
    match_type: contains
    priority: 56
    response: >-
      Lagging indicators (like moving averages) confirm trends after they start;
      leading indicators (like oscillators) try to anticipate turns but give more
      false signals. Many traders combine a lagging trend filter with a leading
      timing tool, always with confirmation.

  - id: indicator-lag
    category: general
    triggers: ["indicator lag", "why indicators lag", "indicators are late"]
    match_type: contains
    priority: 52
    response: >-
      Most indicators are calculated from past prices, so they react after price
      moves - that's lag. It's why signals confirm rather than predict, and why
      combining them with price structure and confirmation works better than
      trusting a single lagging line.

  - id: overfitting
    category: general
    triggers: ["overfitting", "curve fitting", "over optimized strategy"]
    match_type: contains
    priority: 52
    response: >-
      Overfitting (curve fitting) is tuning a strategy so tightly to past data that
      it captures noise, not a real edge - then it fails live. Signs include too
      many parameters and unrealistically perfect backtests. Simpler rules tested
      out-of-sample generalize better.

  - id: what-is-spread-betting
    category: general
    triggers: ["spread betting", "what is spread betting"]
    match_type: contains
    priority: 46
    response: >-
      Spread betting is a leveraged way to speculate on price moves without owning
      the asset, available in some regions. Like all leverage, it magnifies gains
      and losses, and it has its own costs and tax/regulatory rules that vary by
      country. General education, not advice.

  - id: cfd
    category: general
    triggers: ["cfd", "contract for difference", "what is a cfd"]
    match_type: contains
    priority: 48
    response: >-
      A CFD (Contract for Difference) is a leveraged derivative that pays the price
      difference between open and close without owning the asset. It enables long
      and short positions but carries leverage risk and holding costs, and is
      restricted in some regions.

  - id: short-squeeze
    category: general
    triggers: ["short squeeze", "what is a short squeeze"]
    match_type: contains
    priority: 58
    response: >-
      A short squeeze is a sharp rally that forces short sellers to buy back to cut
      losses, which pushes price higher and triggers more buying. It's fueled by
      crowded shorts and can be violent and short-lived. Chasing one is risky
      because it can reverse fast.

  - id: bull-trap
    category: general
    triggers: ["bull trap", "bear trap"]
    match_type: contains
    priority: 56
    response: >-
      A bull trap is a false upside breakout that reverses, trapping buyers; a bear
      trap is the downside version, trapping sellers. Both are essentially fakeouts
      at key levels. Waiting for a confirmed close and retest helps you avoid being
      the trapped trader.

  - id: dead-cat-bounce
    category: general
    triggers: ["dead cat bounce", "relief rally"]
    match_type: contains
    priority: 52
    response: >-
      A dead-cat bounce is a temporary recovery within a larger downtrend that then
      resumes falling. It tempts buyers into thinking the bottom is in. Distinguishing
      it from a real reversal needs confirmation like a break of structure and
      sustained volume.

  - id: accumulation-distribution
    category: general
    triggers: ["accumulation", "distribution", "accumulation distribution", "wyckoff"]
    match_type: contains
    priority: 52
    response: >-
      Accumulation is when informed buyers quietly build positions (often in a range
      after a decline); distribution is quiet selling near tops. The Wyckoff approach
      studies these phases through price and volume. They're frameworks for reading
      intent, confirmed by breakouts.

  - id: mark-to-market
    category: general
    triggers: ["mark to market", "unrealized pnl", "unrealized profit"]
    match_type: contains
    priority: 48
    response: >-
      Mark-to-market values open positions at current prices, showing unrealized
      profit or loss. Unrealized gains aren't locked in until you close - they can
      vanish. Distinguishing realized from unrealized P&L keeps expectations
      grounded.

  - id: realized-pnl
    category: general
    triggers: ["realized pnl", "realized profit", "realized loss"]
    match_type: contains
    priority: 46
    response: >-
      Realized P&L is the profit or loss locked in once a position is closed, unlike
      unrealized P&L which fluctuates while open. Only realized results affect your
      actual balance, which is why exit discipline matters.

  - id: what-is-a-pip
    category: general
    triggers: ["what is a pip", "pip", "pips"]
    match_type: contains
    priority: 50
    response: >-
      A pip is the smallest standard price increment in forex, usually the fourth
      decimal place (0.0001) for most pairs. Traders measure moves, spreads, and
      risk in pips. Pip value depends on position size and the pair.

  - id: what-is-a-tick
    category: general
    triggers: ["what is a tick", "tick size", "ticks"]
    match_type: contains
    priority: 46
    response: >-
      A tick is the minimum price movement of an instrument. Tick size and tick
      value vary by market and determine how much each minimum move is worth,
      which matters for sizing and stop placement in futures and other markets.

  - id: lot-size
    category: general
    triggers: ["lot size", "what is a lot", "standard lot", "mini lot"]
    match_type: contains
    priority: 48
    response: >-
      A lot is a standardized trade quantity, common in forex (a standard lot is
      100,000 units; mini 10,000; micro 1,000). Lot size directly affects risk per
      pip, so it's a key input when sizing positions to your risk limit.

  - id: leverage-ratio-choice
    category: interpretation
    triggers: ["how much leverage should i use", "what leverage is safe", "safe leverage"]
    match_type: contains
    priority: 58
    response: >-
      Lower is safer. Many experienced traders use little or no leverage, and
      beginners are often better off avoiding it until risk management is solid.
      High leverage shrinks the adverse move needed to liquidate you. Size from your
      stop and risk %, not from the maximum leverage offered.

  - id: how-much-to-start
    category: interpretation
    triggers: ["how much money to start trading", "minimum to start", "starting capital"]
    match_type: contains
    priority: 56
    response: >-
      Start with an amount you can fully afford to lose while you learn - small
      enough that mistakes are cheap but real enough to matter emotionally. Skill
      and consistent process matter far more early on than account size. General
      education, not personal financial advice.

  - id: is-trading-gambling
    category: interpretation
    triggers: ["is trading gambling", "trading vs gambling"]
    match_type: contains
    priority: 56
    response: >-
      Trading without an edge, rules, or risk control resembles gambling. What
      separates them is a repeatable positive-expectancy process, disciplined risk,
      and managing probabilities over many trades - not chasing single big wins.
      Structure is the difference.

  - id: can-i-get-rich-quick
    category: interpretation
    triggers: ["get rich quick", "make money fast trading", "double my money"]
    match_type: contains
    priority: 60
    response: >-
      Get-rich-quick expectations usually lead to over-leverage and blown accounts.
      Sustainable trading is slow, probabilistic, and focused on not losing big.
      Anyone promising guaranteed or fast riches is a major red flag. Focus on
      process and risk, not shortcuts.

  - id: why-do-traders-lose
    category: interpretation
    triggers: ["why do most traders lose", "why traders fail", "most traders lose money"]
    match_type: contains
    priority: 58
    response: >-
      Common reasons traders lose: poor risk management and over-leverage, no
      defined edge, emotional decisions (FOMO, revenge trading), overtrading, and
      not following a plan. Notably, most of these are controllable - which is why
      discipline and risk control are emphasized so heavily.

  # ------------------------------------------------------------------
  # 34. FINAL BATCH - CONCEPTS, RATIOS, MISC
  # ------------------------------------------------------------------
  - id: sharpe-ratio
    category: metrics
    triggers: ["sharpe ratio", "what is sharpe ratio"]
    match_type: contains
    priority: 50
    response: >-
      The Sharpe ratio measures return per unit of risk (volatility). A higher
      Sharpe means better risk-adjusted returns. It helps compare strategies
      fairly - a high return with wild swings can be worse than a steadier, lower
      return.

  - id: profit-factor
    category: metrics
    triggers: ["profit factor", "what is profit factor"]
    match_type: contains
    priority: 48
    response: >-
      Profit factor is gross profit divided by gross loss. Above 1 means the system
      makes money; higher is better, though very high values on few trades can be
      unreliable. It's a quick health check for a strategy's results.

  - id: max-consecutive-losses
    category: metrics
    triggers: ["losing streak", "consecutive losses", "how many losses in a row"]
    match_type: contains
    priority: 52
    response: >-
      Losing streaks are normal even for good systems. Small per-trade risk (e.g.,
      1%) ensures a long streak only mildly dents the account, keeping you able to
      keep trading. Planning for streaks psychologically and financially prevents
      panic changes to a working system.

  - id: expectancy-formula
    category: metrics
    triggers: ["expectancy formula", "calculate expectancy", "average trade result"]
    match_type: contains
    priority: 48
    response: >-
      Expectancy ~ (win% x average win) - (loss% x average loss). A positive result
      means the system is profitable over many trades. It shows why win rate alone
      is misleading - the size of wins versus losses matters just as much.

  - id: what-is-alpha
    category: metrics
    triggers: ["what is alpha", "alpha", "generating alpha"]
    match_type: contains
    priority: 46
    response: >-
      Alpha is return above a benchmark after accounting for risk - the value added
      by skill rather than just market exposure. Beating the market consistently is
      hard; much of what looks like alpha is really added risk (beta) in disguise.

  - id: what-is-beta
    category: metrics
    triggers: ["what is beta", "beta", "market beta"]
    match_type: contains
    priority: 46
    response: >-
      Beta measures how much an asset moves relative to the market. Beta above 1
      means it swings more than the market; below 1 means less. High-beta positions
      amplify both gains and losses when the market moves.

  - id: dollar-volume
    category: volume
    triggers: ["dollar volume", "turnover"]
    match_type: contains
    priority: 44
    response: >-
      Dollar volume (turnover) is price times volume - the money changing hands. It
      reflects real liquidity better than share count alone, since a high share
      count in a cheap asset can still be small money. It helps compare liquidity
      across assets.

  - id: climax-volume
    category: volume
    triggers: ["climax volume", "volume spike", "volume climax"]
    match_type: contains
    priority: 50
    response: >-
      A volume spike or climax is an unusually large burst of volume, often at the
      end of a strong move, hinting at exhaustion or a turning point. It can also
      confirm a breakout. Context - where it occurs - decides which meaning applies.

  - id: gap-fill
    category: general
    triggers: ["gap fill", "will the gap fill", "filling the gap"]
    match_type: contains
    priority: 46
    response: >-
      "Filling the gap" is when price later trades back across a prior gap. Many
      gaps fill eventually, but not all, and timing is uncertain. It's a tendency to
      note, not a reliable trade trigger by itself.

  - id: seasonality
    category: general
    triggers: ["seasonality", "seasonal patterns", "sell in may"]
    match_type: contains
    priority: 44
    response: >-
      Seasonality refers to recurring calendar tendencies (like "sell in May" or
      year-end effects). They're statistical tendencies over history, not
      guarantees, and can fail in any given year. Treat them as minor context, not a
      standalone edge.

  - id: mean-reversion-vs-trend
    category: strategy
    triggers: ["mean reversion vs trend following", "trend vs mean reversion"]
    match_type: contains
    priority: 54
    response: >-
      Trend following profits when moves persist; mean reversion profits when price
      snaps back to average. They suit opposite conditions - trends versus ranges -
      which is why identifying the market regime first (e.g., with ADX) helps you
      pick the right approach.

  - id: correlation-btc-alts
    category: crypto
    triggers: ["do altcoins follow bitcoin", "btc correlation alts", "alts follow btc"]
    match_type: contains
    priority: 50
    response: >-
      Altcoins often follow Bitcoin's direction, especially during sharp moves, and
      tend to amplify it - rising more in rallies and falling more in drops. This
      correlation means "diversifying" across many alts may still be one big
      correlated bet on crypto.

  - id: dxy
    category: macro
    triggers: ["dxy", "dollar index", "us dollar index"]
    match_type: contains
    priority: 50
    response: >-
      The DXY (US Dollar Index) tracks the dollar against a basket of currencies. A
      strong dollar often pressures commodities, some stocks, and risk assets; a
      weak dollar can support them. It's a common macro backdrop traders watch.

  - id: bonds-and-stocks
    category: macro
    triggers: ["bonds vs stocks", "bond yields stocks", "how do bonds affect stocks"]
    match_type: contains
    priority: 48
    response: >-
      Rising bond yields make safer income more attractive and raise borrowing
      costs, which can pressure stocks (especially growth names); falling yields
      often support them. The stock-bond relationship shifts over time but is a key
      macro linkage.

  - id: risk-management-summary
    category: risk-management
    triggers: ["risk management tips", "risk management rules", "how to manage risk"]
    match_type: contains
    priority: 70
    response: >-
      Core risk rules: risk a small fixed % per trade (e.g., 1%), always use a stop
      at your invalidation, size from stop distance (not margin), aim for sensible
      risk/reward, limit total and correlated exposure, and avoid over-leverage.
      Protecting capital comes before chasing profit. Type "risk" to size a trade.

  - id: what-is-an-asset
    category: general
    triggers: ["what is an asset", "asset class", "asset classes"]
    match_type: contains
    priority: 44
    response: >-
      An asset is something with economic value you can trade or hold - stocks,
      bonds, currencies, commodities, crypto, real estate. Asset classes behave
      differently and respond to different drivers, which is the basis for
      diversification.

  - id: what-is-a-pnl
    category: general
    triggers: ["what is pnl", "pnl", "profit and loss"]
    match_type: contains
    priority: 46
    response: >-
      P&L (Profit and Loss) is how much a position or account has gained or lost.
      Unrealized P&L moves while a trade is open; realized P&L is locked in on close.
      Tracking both, along with fees, keeps performance honest.

  - id: what-is-roi
    category: general
    triggers: ["what is roi", "roi", "return on investment"]
    match_type: contains
    priority: 46
    response: >-
      ROI (Return on Investment) is profit relative to the amount invested, usually
      a percentage. It lets you compare outcomes of different sizes, but it ignores
      risk and time - a high ROI taken with huge risk isn't necessarily good.

  - id: opportunity-cost
    category: general
    triggers: ["opportunity cost", "what is opportunity cost"]
    match_type: contains
    priority: 42
    response: >-
      Opportunity cost is the value of the best alternative you gave up. Capital
      tied in a stagnant trade can't work elsewhere. Considering it helps you avoid
      holding dead positions just to avoid admitting a mistake.

  - id: what-is-margin-of-safety
    category: general
    triggers: ["margin of safety", "what is margin of safety"]
    match_type: contains
    priority: 42
    response: >-
      Margin of safety is buying with enough cushion below estimated value that
      errors or bad luck don't ruin the outcome. It's a value-investing idea that
      applies broadly: build in room for being wrong rather than assuming your
      analysis is perfect.

  - id: dca-out
    category: strategy
    triggers: ["dca out", "scaling out over time", "selling in tranches"]
    match_type: contains
    priority: 44
    response: >-
      Just as you can dollar-cost average in, you can scale out over time - selling
      portions at intervals to reduce timing risk on exits. It trades maximum
      possible profit for smoother, less stressful selling.

  - id: what-is-a-watchlist
    category: general
    triggers: ["watchlist", "what is a watchlist", "how to build a watchlist"]
    match_type: contains
    priority: 42
    response: >-
      A watchlist is a curated set of assets you monitor for setups, so you focus
      attention instead of scanning everything. Good watchlists are short and match
      your strategy, updated as conditions change. It supports patience and
      selectivity.

  - id: trading-checklist
    category: general
    triggers: ["trading checklist", "pre trade checklist", "entry checklist"]
    match_type: contains
    priority: 48
    response: >-
      A pre-trade checklist forces you to confirm your criteria before entering:
      trend/regime, level, trigger, confirmation, stop, target, risk/reward, and
      position size. It reduces impulsive trades and enforces consistency - one of
      the simplest ways to improve results.

  - id: revenge-vs-plan
    category: psychology
    triggers: ["how to stop revenge trading", "stop overtrading", "control impulses"]
    match_type: contains
    priority: 56
    response: >-
      Practical fixes: set a daily loss limit and stop when hit, step away after a
      loss, use a checklist, keep position sizes small enough to think clearly, and
      journal the emotion behind each trade. Structure beats willpower for breaking
      revenge and overtrading habits.

  - id: what-is-leverage-example
    category: leverage
    triggers: ["leverage example", "how leverage works example", "10x example"]
    match_type: contains
    priority: 60
    response: >-
      Example: with $1,000 at 10x you control $10,000 of exposure. A +5% move earns
      about $500 (50% of your capital); a -5% move loses about $500; roughly -10%
      can wipe the position (liquidation). Same percentage move, ten times the
      impact - that's why leverage cuts both ways.

  - id: stop-loss-vs-mental-stop
    category: risk-management
    triggers: ["mental stop", "hard stop vs mental stop", "should i use mental stops"]
    match_type: contains
    priority: 52
    response: >-
      A hard stop is an order resting in the market; a mental stop is a level you
      intend to act on manually. Mental stops rely on discipline and are easily
      rationalized away in the moment, so most traders - especially beginners -
      benefit from hard stops.

  - id: position-size-crypto
    category: risk-management
    triggers: ["position size crypto", "how much crypto to buy", "crypto position sizing"]
    match_type: contains
    priority: 56
    response: >-
      Crypto position sizing uses the same rule as any market: dollar risk =
      account x risk%; position size = dollar risk / |entry - stop|. Because crypto
      is volatile, stops are often wider, which means smaller positions to keep risk
      constant. Type "risk" to calculate yours.

  # ------------------------------------------------------------------
  # 35. EXTRA CONCEPTS
  # ------------------------------------------------------------------
  - id: what-is-a-swing-high-low
    category: chart-structure
    triggers: ["swing high", "swing low", "what is a swing point"]
    match_type: contains
    priority: 54
    response: >-
      A swing high is a local peak (a candle with lower highs on both sides); a
      swing low is a local trough. These points define market structure and are
      where stops, breakouts, and trendlines are anchored. Tracking them shows
      whether a trend is intact or breaking.

  - id: what-is-a-wick
    category: candlesticks
    triggers: ["what is a wick", "candle wick", "shadow candle", "candle shadow"]
    match_type: contains
    priority: 52
    response: >-
      A wick (or shadow) is the thin line above or below a candle body, marking the
      high and low reached during the period. Long wicks show that price was pushed
      to a level and rejected - a sign of who won the battle at that extreme.

  - id: what-is-slumpflation
    category: macro
    triggers: ["stagflation", "what is stagflation"]
    match_type: contains
    priority: 46
    response: >-
      Stagflation is high inflation combined with weak growth (and often high
      unemployment) - a tough mix because the usual policy tools work against each
      other. It tends to pressure many asset classes at once and complicates
      central-bank decisions.

  - id: what-is-a-catalyst
    category: general
    triggers: ["what is a catalyst", "catalyst", "price catalyst"]
    match_type: contains
    priority: 46
    response: >-
      A catalyst is an event or news item that can spark a significant price move -
      earnings, a product launch, a regulation, or macro data. Traders map upcoming
      catalysts to anticipate volatility, though the reaction versus expectations is
      what actually moves price.

  - id: what-is-a-trend-reversal-signal
    category: interpretation
    triggers: ["signs of trend reversal", "how to spot a reversal", "reversal signs"]
    match_type: contains
    priority: 56
    response: >-
      Common reversal clues (needing confirmation): a break of market structure
      (e.g., uptrend making a lower low), divergence on momentum, a decisive move
      through a key level, a shift in volume, and reversal candles at extremes. One
      clue is weak; several together (confluence) is stronger.

  - id: what-is-a-continuation-signal
    category: interpretation
    triggers: ["signs of trend continuation", "will the trend continue", "continuation signs"]
    match_type: contains
    priority: 54
    response: >-
      Continuation clues include healthy pullbacks that hold support, consolidation
      patterns (flags, triangles) breaking with the trend, momentum staying on the
      trend side, and volume expanding on trend-direction moves. Trading with the
      established trend generally carries better odds than fading it.

  - id: what-does-flat-market-mean
    category: interpretation
    triggers: ["flat market", "choppy market", "no trend", "market going sideways"]
    match_type: contains
    priority: 52
    response: >-
      A flat or choppy market lacks a clear trend, producing false signals for
      trend and breakout strategies. Options: reduce size, switch to range tactics
      (buy support, sell resistance), or stand aside. Recognizing "no trade" as a
      valid choice protects capital in chop.

  - id: how-to-improve-as-trader
    category: interpretation
    triggers: ["how to get better at trading", "improve my trading", "become a better trader"]
    match_type: contains
    priority: 56
    response: >-
      The highest-value habits: keep a trading journal and review it, risk small and
      consistently, master one strategy before adding more, focus on process over
      individual outcomes, and manage emotions with rules and breaks. Improvement
      comes from feedback loops, not from finding a "magic" indicator.

  - id: whats-the-holy-grail
    category: interpretation
    triggers: ["holy grail", "perfect strategy", "guaranteed strategy", "never lose"]
    match_type: contains
    priority: 58
    response: >-
      There's no holy grail - no strategy wins every time or removes risk. The
      closest real "edge" is disciplined risk management plus a modest, consistent
      statistical advantage applied over many trades. Beware anyone selling
      guaranteed or never-lose systems.
